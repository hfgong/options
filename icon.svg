<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Shared suite background (Mobile LaTeX / AirCopy / 农历 / 漢字 / Bark / Big Text) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="innerGlow" cx="28%" cy="22%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </radialGradient>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="payoffGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#090d16" flood-opacity="0.45" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bgGradient)" />
  <rect width="512" height="512" rx="118" fill="url(#innerGlow)" />
  <rect x="2" y="2" width="508" height="508" rx="116" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />

  <g transform="translate(256 256) scale(1.08) translate(-256 -256)">
    <!-- Bell curve: the lognormal / normal distribution behind Black–Scholes -->
    <path d="M 70.0 370.0 L 76.2 369.3 L 82.4 368.5 L 88.6 367.4 L 94.8 365.9 L 101.0 364.2 L 107.2 362.0 L 113.4 359.4 L 119.6 356.2 L 125.8 352.4 L 132.0 347.9 L 138.2 342.7 L 144.4 336.8 L 150.6 330.0 L 156.8 322.5 L 163.0 314.2 L 169.2 305.2 L 175.4 295.5 L 181.6 285.4 L 187.8 274.8 L 194.0 264.0 L 200.2 253.3 L 206.4 242.7 L 212.6 232.7 L 218.8 223.3 L 225.0 214.9 L 231.2 207.7 L 237.4 201.8 L 243.6 197.5 L 249.8 194.9 L 256.0 194.0 L 262.2 194.9 L 268.4 197.5 L 274.6 201.8 L 280.8 207.7 L 287.0 214.9 L 293.2 223.3 L 299.4 232.7 L 305.6 242.7 L 311.8 253.3 L 318.0 264.0 L 324.2 274.8 L 330.4 285.4 L 336.6 295.5 L 342.8 305.2 L 349.0 314.2 L 355.2 322.5 L 361.4 330.0 L 367.6 336.8 L 373.8 342.7 L 380.0 347.9 L 386.2 352.4 L 392.4 356.2 L 398.6 359.4 L 404.8 362.0 L 411.0 364.2 L 417.2 365.9 L 423.4 367.4 L 429.6 368.5 L 435.8 369.3 L 442.0 370.0 Z" fill="url(#bellGrad)" />
    <path d="M 70.0 370.0 L 76.2 369.3 L 82.4 368.5 L 88.6 367.4 L 94.8 365.9 L 101.0 364.2 L 107.2 362.0 L 113.4 359.4 L 119.6 356.2 L 125.8 352.4 L 132.0 347.9 L 138.2 342.7 L 144.4 336.8 L 150.6 330.0 L 156.8 322.5 L 163.0 314.2 L 169.2 305.2 L 175.4 295.5 L 181.6 285.4 L 187.8 274.8 L 194.0 264.0 L 200.2 253.3 L 206.4 242.7 L 212.6 232.7 L 218.8 223.3 L 225.0 214.9 L 231.2 207.7 L 237.4 201.8 L 243.6 197.5 L 249.8 194.9 L 256.0 194.0 L 262.2 194.9 L 268.4 197.5 L 274.6 201.8 L 280.8 207.7 L 287.0 214.9 L 293.2 223.3 L 299.4 232.7 L 305.6 242.7 L 311.8 253.3 L 318.0 264.0 L 324.2 274.8 L 330.4 285.4 L 336.6 295.5 L 342.8 305.2 L 349.0 314.2 L 355.2 322.5 L 361.4 330.0 L 367.6 336.8 L 373.8 342.7 L 380.0 347.9 L 386.2 352.4 L 392.4 356.2 L 398.6 359.4 L 404.8 362.0 L 411.0 364.2 L 417.2 365.9 L 423.4 367.4 L 429.6 368.5 L 435.8 369.3 L 442.0 370.0" fill="none" stroke="#67e8f9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Strike marker -->
    <line x1="256" y1="160" x2="256" y2="388" stroke="#ffffff" stroke-opacity="0.55" stroke-width="6" stroke-dasharray="4 14" stroke-linecap="round" />
    <!-- Long-call payoff ("hockey stick") -->
    <path d="M 92 372 L 256 372 L 410 168" fill="none" stroke="url(#payoffGrad)" stroke-width="30"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />
  </g>

  <!-- Sparkle ✦ -->
  <path d="M 432 382 Q 432 410, 404 410 Q 432 410, 432 438 Q 432 410, 460 410 Q 432 410, 432 382 Z"
        fill="url(#sparkleGrad)" filter="url(#glow)" />
  <circle cx="468" cy="370" r="6" fill="#67e8f9" />
</svg>
